<svg viewBox="0 0 580 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DPS builds a linked list by allocating each cell with a null placeholder, passing it as the destination, and filling the previous cell's next field with struct.set." style="max-width:100%;height:auto;font-family:ui-monospace,monospace;font-size:12px">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Row 1: wrapper allocates Cell(3, null) -->
  <text x="10" y="18" font-size="13" font-weight="bold" fill="currentColor">wrapper: Cell(3, null)</text>

  <rect x="10" y="30" width="60" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="40" y="50" text-anchor="middle" fill="currentColor">3</text>
  <rect x="70" y="30" width="60" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="100" y="50" text-anchor="middle" fill="#888">null</text>
  <text x="40" y="76" text-anchor="middle" fill="#888" font-size="10">val</text>
  <text x="100" y="76" text-anchor="middle" fill="#888" font-size="10">next</text>
  <text x="148" y="50" fill="#e06030" font-size="11">← dst</text>

  <!-- Arrow down to next step -->
  <line x1="40" y1="82" x2="40" y2="108" stroke="#888" stroke-width="1" marker-end="url(#a)"/>
  <text x="50" y="100" fill="#888" font-size="10">tmcDps(2, dst)</text>

  <!-- Row 2: allocate Cell(2, null), struct.set fills Cell(3).next -->
  <text x="10" y="126" font-size="13" font-weight="bold" fill="currentColor">tmcDps(2): struct.set, Cell(2, null)</text>

  <rect x="10" y="138" width="60" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="40" y="158" text-anchor="middle" fill="currentColor">3</text>
  <rect x="70" y="138" width="60" height="32" rx="2" fill="none" stroke="#e06030" stroke-width="1.8"/>
  <text x="92" y="158" text-anchor="middle" fill="currentColor">·</text>
  <!-- arrow from next to Cell(2) -->
  <line x1="115" y1="154" x2="190" y2="154" stroke="currentColor" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="100" y="134" fill="#e06030" font-size="10">struct.set</text>

  <rect x="200" y="138" width="60" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="230" y="158" text-anchor="middle" fill="currentColor">2</text>
  <rect x="260" y="138" width="60" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="290" y="158" text-anchor="middle" fill="#888">null</text>
  <text x="338" y="158" fill="#e06030" font-size="11">← dst</text>

  <!-- Arrow down -->
  <line x1="230" y1="184" x2="230" y2="210" stroke="#888" stroke-width="1" marker-end="url(#a)"/>
  <text x="240" y="202" fill="#888" font-size="10">tmcDps(1, dst)</text>

  <!-- Row 3: allocate Cell(1, null), struct.set fills Cell(2).next -->
  <text x="10" y="228" font-size="13" font-weight="bold" fill="currentColor">tmcDps(1): struct.set, Cell(1, null)</text>

  <rect x="10" y="240" width="60" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="40" y="260" text-anchor="middle" fill="currentColor">3</text>
  <rect x="70" y="240" width="60" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="92" y="260" text-anchor="middle" fill="currentColor">·</text>
  <line x1="115" y1="256" x2="190" y2="256" stroke="currentColor" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="200" y="240" width="60" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="230" y="260" text-anchor="middle" fill="currentColor">2</text>
  <rect x="260" y="240" width="60" height="32" rx="2" fill="none" stroke="#e06030" stroke-width="1.8"/>
  <text x="282" y="260" text-anchor="middle" fill="currentColor">·</text>
  <line x1="305" y1="256" x2="380" y2="256" stroke="currentColor" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="290" y="236" fill="#e06030" font-size="10">struct.set</text>

  <rect x="390" y="240" width="60" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="420" y="260" text-anchor="middle" fill="currentColor">1</text>
  <rect x="450" y="240" width="60" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="480" y="260" text-anchor="middle" fill="#888">null</text>
  <text x="528" y="260" fill="#e06030" font-size="11">← dst</text>

  <!-- Arrow down -->
  <line x1="420" y1="286" x2="420" y2="312" stroke="#888" stroke-width="1" marker-end="url(#a)"/>
  <text x="430" y="304" fill="#888" font-size="10">tmcDps(0, dst)</text>

  <!-- Row 4: base case, return -->
  <text x="10" y="330" font-size="13" font-weight="bold" fill="currentColor">base case: return</text>

  <rect x="10" y="342" width="60" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="40" y="362" text-anchor="middle" fill="currentColor">3</text>
  <rect x="70" y="342" width="60" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="92" y="362" text-anchor="middle" fill="currentColor">·</text>
  <line x1="115" y1="358" x2="190" y2="358" stroke="currentColor" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="200" y="342" width="60" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="230" y="362" text-anchor="middle" fill="currentColor">2</text>
  <rect x="260" y="342" width="60" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="282" y="362" text-anchor="middle" fill="currentColor">·</text>
  <line x1="305" y1="358" x2="380" y2="358" stroke="currentColor" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="390" y="342" width="60" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="420" y="362" text-anchor="middle" fill="currentColor">1</text>
  <rect x="450" y="342" width="60" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="480" y="362" text-anchor="middle" fill="#888">null</text>
</svg>
