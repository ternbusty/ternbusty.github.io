<svg xmlns="http://www.w3.org/2000/svg" width="940" height="280" font-family="system-ui, -apple-system, sans-serif" font-size="12">
<rect width="940" height="280" fill="white"/>
<text x="470" y="22" text-anchor="middle" font-size="16" font-weight="bold">Accumulator Lowering: Per-call Cost at Depth 10,000</text>

<!-- Legend -->
<rect x="340" y="38" width="14" height="14" fill="#EA4335" rx="2"/>
<text x="358" y="49" font-size="11">Tail calls OFF</text>
<rect x="500" y="38" width="14" height="14" fill="#4285F4" rx="2"/>
<text x="518" y="49" font-size="11">Tail calls ON</text>

<!-- X axis grid (0 to 2500 ns; scale: 0.232 px/ns over 580 px from x=280 to x=860) -->
<line x1="280" y1="65" x2="280" y2="210" stroke="#e0e0e0" stroke-width="1"/>
<text x="280" y="228" text-anchor="middle" font-size="10" fill="#666">0 ns</text>
<line x1="396" y1="65" x2="396" y2="210" stroke="#e0e0e0" stroke-width="1"/>
<text x="396" y="228" text-anchor="middle" font-size="10" fill="#666">500 ns</text>
<line x1="512" y1="65" x2="512" y2="210" stroke="#e0e0e0" stroke-width="1"/>
<text x="512" y="228" text-anchor="middle" font-size="10" fill="#666">1,000 ns</text>
<line x1="628" y1="65" x2="628" y2="210" stroke="#e0e0e0" stroke-width="1"/>
<text x="628" y="228" text-anchor="middle" font-size="10" fill="#666">1,500 ns</text>
<line x1="744" y1="65" x2="744" y2="210" stroke="#e0e0e0" stroke-width="1"/>
<text x="744" y="228" text-anchor="middle" font-size="10" fill="#666">2,000 ns</text>
<line x1="860" y1="65" x2="860" y2="210" stroke="#e0e0e0" stroke-width="1"/>
<text x="860" y="228" text-anchor="middle" font-size="10" fill="#666">2,500 ns</text>
<text x="570" y="252" text-anchor="middle" font-size="11" fill="#666">CPU time per individual call (lower is better)</text>

<!-- Row 1: Int addition (f(n-1) + n) -->
<text x="270" y="94" text-anchor="end" font-size="11">Int addition</text>
<rect x="280" y="78" width="492.1" height="20" fill="#EA4335" rx="2" opacity="0.85"/>
<line x1="717.6" y1="88" x2="842.4" y2="88" stroke="#EA4335" stroke-width="1.5"/>
<line x1="717.6" y1="84" x2="717.6" y2="92" stroke="#EA4335" stroke-width="1.5"/>
<line x1="842.4" y1="84" x2="842.4" y2="92" stroke="#EA4335" stroke-width="1.5"/>
<text x="846.4" y="92" font-size="9" fill="#333">2,121 ns</text>
<rect x="280" y="102" width="91.6" height="20" fill="#4285F4" rx="2" opacity="0.85"/>
<line x1="365.4" y1="112" x2="379.1" y2="112" stroke="#4285F4" stroke-width="1.5"/>
<line x1="365.4" y1="108" x2="365.4" y2="116" stroke="#4285F4" stroke-width="1.5"/>
<line x1="379.1" y1="108" x2="379.1" y2="116" stroke="#4285F4" stroke-width="1.5"/>
<text x="383.1" y="116" font-size="9" fill="#333">395 ns</text>
<line x1="280" y1="135" x2="860" y2="135" stroke="#f0f0f0" stroke-width="1"/>

<!-- Row 2: Int multiplication (n * f(n-1)) -->
<text x="270" y="164" text-anchor="end" font-size="11">Int multiplication</text>
<rect x="280" y="148" width="422.5" height="20" fill="#EA4335" rx="2" opacity="0.85"/>
<line x1="691.1" y1="158" x2="714.5" y2="158" stroke="#EA4335" stroke-width="1.5"/>
<line x1="691.1" y1="154" x2="691.1" y2="162" stroke="#EA4335" stroke-width="1.5"/>
<line x1="714.5" y1="154" x2="714.5" y2="162" stroke="#EA4335" stroke-width="1.5"/>
<text x="718.5" y="162" font-size="9" fill="#333">1,821 ns</text>
<rect x="280" y="172" width="226.7" height="20" fill="#4285F4" rx="2" opacity="0.85"/>
<line x1="506.2" y1="182" x2="507.1" y2="182" stroke="#4285F4" stroke-width="1.5"/>
<line x1="506.2" y1="178" x2="506.2" y2="186" stroke="#4285F4" stroke-width="1.5"/>
<line x1="507.1" y1="178" x2="507.1" y2="186" stroke="#4285F4" stroke-width="1.5"/>
<text x="511.1" y="186" font-size="9" fill="#333">977 ns</text>
<line x1="280" y1="205" x2="860" y2="205" stroke="#f0f0f0" stroke-width="1"/>
</svg>
