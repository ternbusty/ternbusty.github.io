<svg xmlns="http://www.w3.org/2000/svg" width="940" height="510" font-family="system-ui, -apple-system, sans-serif" font-size="12">
<rect width="940" height="510" fill="white"/>
<text x="470" y="22" text-anchor="middle" font-size="16" font-weight="bold">Per-call Cost at Depth 10,000</text>

<!-- Legend -->
<rect x="340" y="38" width="14" height="14" fill="#EA4335" rx="2"/>
<text x="358" y="49" font-size="11">Tail calls OFF</text>
<rect x="500" y="38" width="14" height="14" fill="#4285F4" rx="2"/>
<text x="518" y="49" font-size="11">Tail calls ON</text>

<!-- X axis grid + tick labels (0 to 8000 ns; scale: 0.0725 px/ns over 580 px from x=280 to x=860) -->
<line x1="280" y1="75" x2="280" y2="450" stroke="#e0e0e0" stroke-width="1"/>
<text x="280" y="468" text-anchor="middle" font-size="10" fill="#666">0 ns</text>
<line x1="425" y1="75" x2="425" y2="450" stroke="#e0e0e0" stroke-width="1"/>
<text x="425" y="468" text-anchor="middle" font-size="10" fill="#666">2,000 ns</text>
<line x1="570" y1="75" x2="570" y2="450" stroke="#e0e0e0" stroke-width="1"/>
<text x="570" y="468" text-anchor="middle" font-size="10" fill="#666">4,000 ns</text>
<line x1="715" y1="75" x2="715" y2="450" stroke="#e0e0e0" stroke-width="1"/>
<text x="715" y="468" text-anchor="middle" font-size="10" fill="#666">6,000 ns</text>
<line x1="860" y1="75" x2="860" y2="450" stroke="#e0e0e0" stroke-width="1"/>
<text x="860" y="468" text-anchor="middle" font-size="10" fill="#666">8,000 ns</text>
<text x="570" y="492" text-anchor="middle" font-size="11" fill="#666">CPU time per individual call (lower is better)</text>

<!-- Row 1: Static mutual recursion -->
<text x="270" y="104" text-anchor="end" font-size="11">Static mutual recursion</text>
<rect x="280" y="88" width="78.4" height="20" fill="#EA4335" rx="2" opacity="0.85"/>
<line x1="358.1" y1="98" x2="358.7" y2="98" stroke="#EA4335" stroke-width="1.5"/>
<line x1="358.1" y1="94" x2="358.1" y2="102" stroke="#EA4335" stroke-width="1.5"/>
<line x1="358.7" y1="94" x2="358.7" y2="102" stroke="#EA4335" stroke-width="1.5"/>
<text x="362.7" y="102" font-size="9" fill="#333">1,082 ns</text>
<rect x="280" y="112" width="28.8" height="20" fill="#4285F4" rx="2" opacity="0.85"/>
<line x1="308.7" y1="122" x2="308.9" y2="122" stroke="#4285F4" stroke-width="1.5"/>
<line x1="308.7" y1="118" x2="308.7" y2="126" stroke="#4285F4" stroke-width="1.5"/>
<line x1="308.9" y1="118" x2="308.9" y2="126" stroke="#4285F4" stroke-width="1.5"/>
<text x="312.9" y="126" font-size="9" fill="#333">397 ns</text>
<line x1="280" y1="145" x2="860" y2="145" stroke="#f0f0f0" stroke-width="1"/>

<!-- Row 2: Non-tailrec self recursion -->
<text x="270" y="174" text-anchor="end" font-size="11">Non-`tailrec` self recursion</text>
<rect x="280" y="158" width="140.5" height="20" fill="#EA4335" rx="2" opacity="0.85"/>
<line x1="418.6" y1="168" x2="422.4" y2="168" stroke="#EA4335" stroke-width="1.5"/>
<line x1="418.6" y1="164" x2="418.6" y2="172" stroke="#EA4335" stroke-width="1.5"/>
<line x1="422.4" y1="164" x2="422.4" y2="172" stroke="#EA4335" stroke-width="1.5"/>
<text x="426.4" y="172" font-size="9" fill="#333">1,938 ns</text>
<rect x="280" y="182" width="32.5" height="20" fill="#4285F4" rx="2" opacity="0.85"/>
<line x1="312.5" y1="192" x2="312.6" y2="192" stroke="#4285F4" stroke-width="1.5"/>
<line x1="312.5" y1="188" x2="312.5" y2="196" stroke="#4285F4" stroke-width="1.5"/>
<line x1="312.6" y1="188" x2="312.6" y2="196" stroke="#4285F4" stroke-width="1.5"/>
<text x="316.6" y="196" font-size="9" fill="#333">448 ns</text>
<line x1="280" y1="215" x2="860" y2="215" stroke="#f0f0f0" stroke-width="1"/>

<!-- Row 3: Virtual dispatch -->
<text x="270" y="244" text-anchor="end" font-size="11">Virtual dispatch</text>
<rect x="280" y="228" width="119.8" height="20" fill="#EA4335" rx="2" opacity="0.85"/>
<line x1="399.3" y1="238" x2="400.4" y2="238" stroke="#EA4335" stroke-width="1.5"/>
<line x1="399.3" y1="234" x2="399.3" y2="242" stroke="#EA4335" stroke-width="1.5"/>
<line x1="400.4" y1="234" x2="400.4" y2="242" stroke="#EA4335" stroke-width="1.5"/>
<text x="404.4" y="242" font-size="9" fill="#333">1,653 ns</text>
<rect x="280" y="252" width="70.9" height="20" fill="#4285F4" rx="2" opacity="0.85"/>
<line x1="350.4" y1="262" x2="351.5" y2="262" stroke="#4285F4" stroke-width="1.5"/>
<line x1="350.4" y1="258" x2="350.4" y2="266" stroke="#4285F4" stroke-width="1.5"/>
<line x1="351.5" y1="258" x2="351.5" y2="266" stroke="#4285F4" stroke-width="1.5"/>
<text x="355.5" y="266" font-size="9" fill="#333">978 ns</text>
<line x1="280" y1="285" x2="860" y2="285" stroke="#f0f0f0" stroke-width="1"/>

<!-- Row 4: Interface dispatch -->
<text x="270" y="314" text-anchor="end" font-size="11">Interface dispatch</text>
<rect x="280" y="298" width="516.9" height="20" fill="#EA4335" rx="2" opacity="0.85"/>
<line x1="795.4" y1="308" x2="798.4" y2="308" stroke="#EA4335" stroke-width="1.5"/>
<line x1="795.4" y1="304" x2="795.4" y2="312" stroke="#EA4335" stroke-width="1.5"/>
<line x1="798.4" y1="304" x2="798.4" y2="312" stroke="#EA4335" stroke-width="1.5"/>
<text x="802.4" y="312" font-size="9" fill="#333">7,130 ns</text>
<rect x="280" y="322" width="172.4" height="20" fill="#4285F4" rx="2" opacity="0.85"/>
<line x1="448.4" y1="332" x2="456.4" y2="332" stroke="#4285F4" stroke-width="1.5"/>
<line x1="448.4" y1="328" x2="448.4" y2="336" stroke="#4285F4" stroke-width="1.5"/>
<line x1="456.4" y1="328" x2="456.4" y2="336" stroke="#4285F4" stroke-width="1.5"/>
<text x="460.4" y="336" font-size="9" fill="#333">2,378 ns</text>
<line x1="280" y1="355" x2="860" y2="355" stroke="#f0f0f0" stroke-width="1"/>

<!-- Row 5: tailrec -->
<text x="270" y="384" text-anchor="end" font-size="11">`tailrec` lowered to a loop</text>
<rect x="280" y="368" width="26.5" height="20" fill="#EA4335" rx="2" opacity="0.85"/>
<line x1="306.4" y1="378" x2="306.6" y2="378" stroke="#EA4335" stroke-width="1.5"/>
<line x1="306.4" y1="374" x2="306.4" y2="382" stroke="#EA4335" stroke-width="1.5"/>
<line x1="306.6" y1="374" x2="306.6" y2="382" stroke="#EA4335" stroke-width="1.5"/>
<text x="310.6" y="382" font-size="9" fill="#333">366 ns</text>
<rect x="280" y="392" width="26.5" height="20" fill="#4285F4" rx="2" opacity="0.85"/>
<line x1="306.4" y1="402" x2="306.7" y2="402" stroke="#4285F4" stroke-width="1.5"/>
<line x1="306.4" y1="398" x2="306.4" y2="406" stroke="#4285F4" stroke-width="1.5"/>
<line x1="306.7" y1="398" x2="306.7" y2="406" stroke="#4285F4" stroke-width="1.5"/>
<text x="310.7" y="406" font-size="9" fill="#333">366 ns</text>
<line x1="280" y1="425" x2="860" y2="425" stroke="#f0f0f0" stroke-width="1"/>
</svg>
